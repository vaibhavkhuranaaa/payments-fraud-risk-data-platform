requires-python = ">=3.12"
dependencies = [
  "fastapi==0.128.8",
  "psycopg[binary]==3.2.13",
  "uvicorn[standard]==0.39.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "numpy==2.0.2",
  "scikit-learn==1.6.1",
]

[tool.uv]
package = false
