services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: risk_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d risk_demo"]
      interval: 2s
      timeout: 3s
      retries: 20
