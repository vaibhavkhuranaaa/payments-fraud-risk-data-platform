services:
  - type: web
    name: payments-risk-api
    runtime: docker
    plan: free
    region: ohio
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        sync: false
